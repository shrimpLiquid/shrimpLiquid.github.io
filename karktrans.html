<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to HTML Converter</title>
    <link rel="stylesheet" href="index.css"> <!-- Link to CSS file -->
</head>
<body>
    <div class="converter-container">
        
        <label for="inputText"></label>
        <textarea id="inputText" rows="10" placeholder="Type or paste text..."></textarea>
        
        <button onclick="convertToHtml()"> CONVERT</button>
        
        <label for="outputCode"></label>
        <textarea id="outputCode" rows="10" readonly></textarea>
        
        
    </div>

    <script src="trans.js"></script> <!-- Link to JavaScript file -->
</body>
</html>
