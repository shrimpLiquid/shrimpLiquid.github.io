<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to HTML Converter</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to CSS file -->
</head>
<body>
    <div class="converter-container">
        <h1>Text to HTML Converter</h1>
        
        <label for="inputText">Paste your plain text here:</label>
        <textarea id="inputText" rows="10" placeholder="Type or paste text..."></textarea>
        
        <button onclick="convertToHtml()">Convert to HTML</button>
        
        <label for="outputCode">Generated HTML code:</label>
        <textarea id="outputCode" rows="10" readonly></textarea>
        
        <button onclick="copyToClipboard()">Copy HTML</button>
    </div>

    <script src="script.js"></script> <!-- Link to JavaScript file -->
</body>
</html>
