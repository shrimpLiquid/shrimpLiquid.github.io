<!DOCTYPE html>
<html>
<head>
    <title>Auto-Process Demo</title>
</head>
<body>
    <h1>Automatic Pillow Processing</h1>
    <p id="status">Waking up server...</p>
    <img id="display" src="" style="max-width: 500px;">

    <script>
        // Use your actual Render/PythonAnywhere URL here
        const API_URL = "https://shrimpliquid-github-io.onrender.com/get-processed-image";

        window.onload = async () => {
            const status = document.getElementById('status');
            const display = document.getElementById('display');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                display.src = data.image;
                status.innerText = "Processing Complete!";
            } catch (err) {
                status.innerText = "Error: Make sure the Python server is running.";
                console.error(err);
            }
        };
    </script>
</body>
</html>
