<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pillow Image Processor</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        img { max-width: 100%; margin-top: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h1>Image Processor</h1>
    <input type="file" id="upload" accept="image/*">
    <br>
    <div id="status"></div>
    <img id="resultImage" src="" alt="Result will appear here">

    <script>
        const upload = document.getElementById('upload');
        const resultImage = document.getElementById('resultImage');
        const status = document.getElementById('status');

        // REPLACE THIS URL with your actual Render/PythonAnywhere URL
        const PYTHON_BACKEND_URL = "https://your-app-name.onrender.com/process";

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onloadend = async () => {
                status.innerText = "Processing...";
                
                try {
                    const response = await fetch(PYTHON_BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: reader.result })
                    });

                    const data = await response.json();
                    resultImage.src = data.processed_image;
                    status.innerText = "Done!";
                } catch (err) {
                    console.error(err);
                    status.innerText = "Error connecting to Python backend.";
                }
            };

            if (file) reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
